services:
  postgres:
    image: postgres:16-alpine
    container_name: codepath-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codepath}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - codepath-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: codepath-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - codepath-redis-data:/data

volumes:
  codepath-pgdata:
  codepath-redis-data:
