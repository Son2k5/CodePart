# Standalone production stack. Do NOT combine with docker-compose.yml.
# docker compose --env-file .env.production -f docker-compose.production.yml up -d --build
# Optional profiles: ai / rag (rag includes ai). Set AI_ENABLED/RAG_ENABLED too.
x-rag-environment: &rag-environment
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.35}
  RAG_ASSET_HOSTS: ${RAG_ASSET_HOSTS:-api.cloudinary.com,res.cloudinary.com}

x-python-service: &python-service
  build:
    context: ../ai-service
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  extra_hosts:
    - host.docker.internal:host-gateway
  pids_limit: 100
  networks:
    - backend
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
    interval: 15s
    timeout: 3s
    retries: 3
    start_period: 10s

services:
  redis:
    image: redis:7-alpine
    container_name: codepath-redis
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - |
        printf 'user default on >%s ~* &* +@all\n' "$$(cat /run/secrets/redis_password)" > /tmp/users.acl
        chmod 600 /tmp/users.acl
        exec redis-server --appendonly yes --aclfile /tmp/users.acl
    volumes:
      - codepath-redis-data:/data
    secrets:
      - redis_password
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$$(cat /run/secrets/redis_password)" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      AllowedHosts: ${SERVER_NAME:?SERVER_NAME must be set}
      Database__Host: ${DATABASE_HOST:?DATABASE_HOST must be set}
      Database__Port: ${DATABASE_PORT:-3306}
      Database__Name: ${DATABASE_NAME:-codepath}
      Database__User: ${DATABASE_USER:?DATABASE_USER must be set}
      Redis__Host: redis
      Jwt__Issuer: ${JWT_ISSUER:-CodePath.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-CodePath.Client}
      Cors__AllowedOrigins__0: https://${SERVER_NAME:?SERVER_NAME must be set}
      AuthFrontend__PublicBaseUrl: https://${SERVER_NAME:?SERVER_NAME must be set}
      ReverseProxy__KnownNetworks__0: 172.30.0.0/24
      Email__Smtp__Host: ${SMTP_HOST:?SMTP_HOST must be set}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__Username: ${SMTP_USERNAME:?SMTP_USERNAME must be set}
      Email__Smtp__FromAddress: ${SMTP_FROM_ADDRESS:?SMTP_FROM_ADDRESS must be set}
      Email__Smtp__FromName: ${SMTP_FROM_NAME:-CodePath}
      Email__Smtp__SocketOptions: ${SMTP_SOCKET_OPTIONS:-StartTls}
      CodeExecution__Judge0__BaseUrl: ${JUDGE0_BASE_URL:?JUDGE0_BASE_URL must be set}
      # Optional integration with an existing Judge0 service.
      Judge__Enabled: ${JUDGE_ENABLED:-false}
      Judge__BaseUrl: ${JUDGE_BASE_URL:-http://host.docker.internal:2358/}
      Judge__ApiToken: ${JUDGE_API_TOKEN:-}
      Ai__Enabled: ${AI_ENABLED:-false}
      Ai__BaseUrl: http://ai-service:8000/
      Ai__ServiceKey: ${AI_SERVICE_KEY:-}
      Ai__AnonymizationKey: ${AI_ANONYMIZATION_KEY:-}
      Rag__Enabled: ${RAG_ENABLED:-false}
      Rag__IndexBaseUrl: http://ai-indexer:8000/
    extra_hosts:
      - host.docker.internal:host-gateway
    secrets:
      - source: database_password
        target: Database__Password
      - source: redis_password
        target: Redis__Password
      - source: jwt_signing_key
        target: Jwt__SigningKey
      - source: smtp_password
        target: Email__Smtp__Password
      - source: admin01_password
        target: ADMIN01_PASSWORD
      - source: admin02_password
        target: ADMIN02_PASSWORD
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
        required: false
      ai-indexer:
        condition: service_healthy
        required: false

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    secrets:
      - tls_certificate
      - tls_private_key
    networks:
      backend:
        ipv4_address: 172.30.0.10
    depends_on:
      - api

  ai-service:
    <<: *python-service
    profiles: [ai, rag]
    cpus: 1.0
    mem_limit: 768m
    # Validate only when this profile starts; Redis/API-only deployments need no AI keys.
    command:
      - /bin/sh
      - -ec
      - |
        : "$${SERVICE_API_KEY:?Set AI_SERVICE_KEY}"
        : "$${REDIS_URL:?Set AI_REDIS_URL to an authenticated Redis URL}"
        : "$${LLM_MODEL:?Set LLM_MODEL}"
        : "$${LLM_ADVANCED_MODEL:?Set LLM_ADVANCED_MODEL}"
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --limit-concurrency 32
    environment:
      <<: *rag-environment
      PYTHONDONTWRITEBYTECODE: "1"
      SERVICE_API_KEY: ${AI_SERVICE_KEY:-}
      REDIS_URL: ${AI_REDIS_URL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_ADVANCED_MODEL: ${LLM_ADVANCED_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
    depends_on:
      redis:
        condition: service_healthy

  ai-indexer:
    <<: *python-service
    profiles: [rag]
    cpus: 1.0
    mem_limit: 1g
    command:
      - /bin/sh
      - -ec
      - |
        : "$${SERVICE_API_KEY:?Set AI_SERVICE_KEY}"
        : "$${QDRANT_API_KEY:?Set QDRANT_API_KEY}"
        : "$${EMBEDDING_BASE_URL:?Set EMBEDDING_BASE_URL}"
        : "$${EMBEDDING_MODEL:?Set EMBEDDING_MODEL}"
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --limit-concurrency 4
    environment:
      <<: *rag-environment
      PYTHONDONTWRITEBYTECODE: "1"
      SERVICE_API_KEY: ${AI_SERVICE_KEY:-}
    depends_on:
      qdrant:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:v1.17.1
    profiles: [rag]
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - |
        : "$${QDRANT__SERVICE__API_KEY:?Set QDRANT_API_KEY}"
        exec ./entrypoint.sh
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - backend
    # Only web publishes production ports; Redis, API, AI and Qdrant stay internal.

volumes:
  codepath-redis-data:
  qdrant-data:

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

secrets:
  database_password:
    file: ./secrets/database_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  jwt_signing_key:
    file: ./secrets/jwt_signing_key.txt
  smtp_password:
    file: ./secrets/smtp_password.txt
  admin01_password:
    file: ./secrets/admin01_password.txt
  admin02_password:
    file: ./secrets/admin02_password.txt
  tls_certificate:
    file: ./secrets/tls/fullchain.pem
  tls_private_key:
    file: ./secrets/tls/privkey.pem
