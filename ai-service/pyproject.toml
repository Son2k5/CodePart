[project]
name = "codepath-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "redis>=5,<7", "tenacity>=9,<10", "PyYAML>=6,<7", "jinja2>=3.1,<4", "scikit-learn>=1.5,<2", "joblib>=1.4,<2", "pypdf>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
training = ["pandas>=2.2,<3", "pyarrow>=18,<24", "matplotlib>=3.9,<4", "datasets>=3,<5"]
transformer = ["transformers>=4.46,<5", "torch>=2.4", "accelerate>=1", "peft>=0.13", "trl>=0.12"]

[tool.setuptools.packages.find]
include = ["app*", "training*"]
[tool.setuptools.package-data]
app = ["prompts/*.yaml", "prompts/*.jinja"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
